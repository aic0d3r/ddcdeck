name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install GTK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev libgtk4-layer-shell-dev

      - name: Packages that can build here
        id: pkgs
        run: |
          # the GUI package is cgo: if the layer-shell dev package is missing on the
          # runner's distro, keep testing the daemon/CLI instead of failing the run
          if pkg-config --exists gtk4-layer-shell-0 && pkg-config --exists libadwaita-1; then
            echo list=./... >> "$GITHUB_OUTPUT"
          else
            echo list="$(go list ./... | grep -v /internal/gui)" >> "$GITHUB_OUTPUT"
          fi

      - name: vet
        run: go vet ${{ steps.pkgs.outputs.list }}

      - name: test
        run: go test -race ${{ steps.pkgs.outputs.list }}

      - name: build
        run: make build build-gui
