name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    # 26.04: the GUI links libgtk4-layer-shell, which Ubuntu only packages from 25.04 on.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # libgirepository1.0-dev: gotk4's cgo needs gobject-introspection-1.0.pc
      - name: Install GTK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev libgtk4-layer-shell-dev libgirepository1.0-dev

      # The GTK bindings are cgo and take minutes to compile, once per distinct set of build
      # flags. -trimpath matches `make build-gui`, so vet and the build share one compile;
      # testing only packages that have tests (the GUI has none) avoids a third, -race, one.
      - name: vet
        run: go vet -trimpath ./...

      # The core must stay OS-independent: everything Linux-specific lives in internal/platform.
      - name: core builds on Windows and macOS
        run: |
          core="./internal/deck ./internal/automation ./internal/model ./internal/ddc ./internal/edid ./internal/location ./internal/wizard"
          GOOS=windows go vet $core
          GOOS=darwin go vet $core

      - name: test
        run: go test -race $(go list -f '{{if or .TestGoFiles .XTestGoFiles}}{{.ImportPath}}{{end}}' ./...)

      - name: build
        run: make build build-gui
